name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Flet
        run: pip install --upgrade flet

      - name: Build APK
        run: flet build apk --project "ORADO Domino 101" --org "com.orado.domino"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORADO-Domino-101-APK
          path: build/apk/*.apk
