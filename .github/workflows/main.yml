name: Build ORADO Domino 101 APK (arm64-v8a)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Gradle for arm64-v8a only
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/only-arm64.gradle
          gradle.projectsEvaluated {
              def sp = rootProject.findProject(":serious_python_android")
              if (sp != null) {
                  sp.tasks.matching { t ->
                      t.name.contains("x86_64") || t.name.contains("armeabi_v7a") || t.name.contains("x86")
                  }.configureEach { t ->
                      t.enabled = false
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gTTS

      - name: Generate Indonesian Referee Voice Assets
        run: |
          mkdir -p assets
          python - << 'EOF'
          from gtts import gTTS

          voices = {
              "voice_ringan.mp3": "Pelanggaran ringan.",
              "voice_penalti_11.mp3": "Penalti sebelas poin.",
              "voice_penalti_25.mp3": "Penalti dua puluh lima poin.",
              "voice_pass_palsu_50.mp3": "Pass palsu, penalti lima puluh poin.",
              "voice_pass_palsu_kalah.mp3": "Pass palsu sisa tiga batu, lawan kalah set.",
              "voice_apollo.mp3": "Apollo! Menang dua set sekaligus!",
              "voice_7balak.mp3": "Tujuh balak! Sah seratus satu!",
              "voice_2x.mp3": "Dua kali ujung sama.",
              "voice_balak50.mp3": "Balak sempurna, tambah lima puluh.",
              "voice_beradu.mp3": "Batu beradu, hitung sisa mata.",
              "voice_beradu_seri.mp3": "Batu beradu seri, nol poin.",
          }

          for filename, text in voices.items():
              tts = gTTS(text=text, lang="id", slow=False)
              tts.save(f"assets/{filename}")
              print(f"Generated assets/{filename}")
          EOF

      - name: Build Android APK (arm64-v8a only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          printf "y\ny\ny\ny\ny\n" | flet build apk --verbose --arch arm64-v8a --project "SkorDominoORADO" --product "ORADO Domino 101" --org "id.oradocirebon.domino" --build-version "2026.1.0"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkorDominoORADO-2026-arm64
          path: build/apk/*.apk
