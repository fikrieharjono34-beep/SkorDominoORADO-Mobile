name: Build ORADO Domino 101 APK (arm64-v8a)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Android APK (arm64-v8a only)
        run: |
          printf "y\ny\ny\ny\ny\n" | flet build apk --arch arm64-v8a --project "SkorDominoORADO" --product "ORADO Domino 101" --org "id.oradocirebon.domino" --build-version "2026.1.0"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkorDominoORADO-2026-arm64
          path: build/apk/*.apk
