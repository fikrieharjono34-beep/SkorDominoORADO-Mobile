name: Build ORADO Domino 101 APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Android APK (arm64-v8a only)
        run: |
          flet build apk --yes --arch arm64-v8a --assets-dir assets --project "SkorDominoORADO" --product "ORADO Domino 101" --org "id.oradocirebon.domino" --build-version "2026.1.0"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkorDominoORADO_2026_arm64
          path: build/apk/*.apk
